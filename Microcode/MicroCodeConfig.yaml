# MicroCodeConfig.yaml
# This file defines the instruction set and maps signal names to their
# respective 4-bit control codes for InputControl and OutputControl.
# It also includes extra control signals and virtual pin definitions.

InsConfig:
  Instructions:
    # Format for instructions:
    # - opcode: base opcode value or mask pattern
    # - size: instruction size in bytes (default mode)
    # - size_8bit: instruction size in 8-bit address mode (optional, defaults to size)
    #
    # Notation:
    # - 'x' in binary means "don't care" bit (will be filled by operands)
    # - For SSDD format: SS=source register, DD=destination register
    # - For RRTT format: RR=register, TT=type/subtype

    NOP:
      opcode: "0b0000_0000"
      size: 1
      description: "No operation"

    ADD:
      opcode: "0bxxxx_0001"
      size: 1
      description: "Add 2 registers and update to destination"

    SUB:
      opcode: "0bxxxx_0010"
      size: 1
      description: "Subtract source from dest. & update to dest."

    MOV:
      opcode: "0bxxxx_0011"
      size: 1
      description: "Move from source to destination"

    AND:
      opcode: "0bxxxx_0100"
      size: 1
      description: "Logical AND operation; update to destination"

    OR:
      opcode: "0bxxxx_0101"
      size: 1
      description: "Logical OR operation; update to destination"

    XOR:
      opcode: "0bxxxx_0110"
      size: 1
      description: "Logical XOR operation; update to destination"

    LDR:
      opcode: "0bxxxx_0111"
      size: 1
      description: "Load destination from memory address in source"

    STR:
      opcode: "0bxxxx_1000"
      size: 1
      description: "Save register value to memory address in source"

    CMP:
      opcode: "0bxxxx_1001"
      size: 1
      description: "Compare two register values (unsigned); update the flag"

    CMPS:
      opcode: "0bxxxx_1010"
      size: 1
      description: "Compare two register values (signed); update the flag"

    SHL:
      opcode: "0bxx00_1011"
      size: 1
      description: "Shift register left by 1 bit"

    SHR:
      opcode: "0bxx01_1011"
      size: 1
      description: "Shift register right by 1 bit"

    INC:
      opcode: "0bxx10_1011"
      size: 1
      description: "Increment register by 1"

    DEC:
      opcode: "0bxx11_1011"
      size: 1
      description: "Decrement register by 1"

    LDI:
      opcode: "0bxx00_1100"
      size: 2
      description: "Load the value to register immediately"

    LDM:
      opcode: "0bxx01_1100"
      size: 2
      description: "Load from value to register from memory"

    SAV:
      opcode: "0bxx10_1100"
      size: 2
      description: "Save the register value to memory"

    NOT:
      opcode: "0bxx11_1100"
      size: 1
      description: "Bitwise NOT operation; update same register"

    CMI:
      opcode: "0bxx00_1101"
      size: 2
      description: "Compare register with immediate value (unsigned)"

    CMIS:
      opcode: "0bxx01_1101"
      size: 2
      description: "Compare register with immediate value (signed)"

    PUSH:
      opcode: "0bxx10_1101"
      size: 1
      description: "Push register value to stack"

    POP:
      opcode: "0bxx11_1101"
      size: 1
      description: "Pop from stack and load to register"

    JMP:
      opcode: "0b0000_1110"
      size: 3
      description: "Jump to address"

    JMZ:
      opcode: "0b0001_1110"
      size: 3
      description: "Jump to address if Zero flag set"

    JNZ:
      opcode: "0b0010_1110"
      size: 3
      description: "Jump to address if Zero flag NOT set"

    JMC:
      opcode: "0b0011_1110"
      size: 3
      description: "Jump to address if Carry flag set"

    JME:
      opcode: "0b0100_1110"
      size: 3
      description: "Jump to address if Eql flag is set"

    JMG:
      opcode: "0b0101_1110"
      size: 3
      description: "Jump to address if Grt flag is set"

    JML:
      opcode: "0b0110_1110"
      size: 3
      description: "Jump to address if Lst flag is set"

    PSHV:
      opcode: "0b0000_1111"
      size: 2
      description: "Push immediate value to stack"

    CALL:
      opcode: "0b0001_1111"
      size: 3
      description: "Push the PC to Stack (PC high & low) & load new address"

    RTN:
      opcode: "0b0010_1111"
      size: 1
      description: "Pop the PC address and restore"

    OUT:
      opcode: "0b0011_1111"
      size: 1
      description: "Display unsigned value in 7-Segment"

    OUTS:
      opcode: "0b0100_1111"
      size: 1
      description: "Display signed value in 7-Segment"

    HLT:
      opcode: "0b0101_1111"
      size: 1
      description: "Halt the platform"

    RST:
      opcode: "0b1111_1111"
      size: 1
      description: "Reset it self"


VirtualPinConfig:
  InputControl:
    # 4 virtual pins for input control.
    # format [ViInD, ViInC, ViInB, ViInA]
    #         DCBA
    rAI   : 0b0000
    rBI   : 0b0001
    rCI   : 0b0010
    rDI   : 0b0011
    PCLI  : 0b0100
    PCHI  : 0b0101
    MdI   : 0b0110
    MeI   : 0b0111
    IRI   : 0b1000
    T1I   : 0b1001
    RESRV1: 0b1010
    Seg7E : 0b1011
    SpL   : 0b1100
    RESRV2: 0b1101
    RESRV3: 0b1110
    RESRV4: 0b1111 # Reserved if no Pin need to be enabled
  OutputControl:
    # 4 virtual pins for output control.
    # format [ViOtD, ViOtC, ViOtB, ViOtA]
    #         DCBA
    rAO   : 0b0000
    rBO   : 0b0001
    rCO   : 0b0010
    rDO   : 0b0011
    RomO  : 0b0100
    SpO   : 0b0101
    MeO   : 0b0110
    AdSuO : 0b0111
    OrO   : 0b1000
    AndO  : 0b1001
    XorO  : 0b1010
    NtO   : 0b1011
    PCHO  : 0b1100
    PCLO  : 0b1101
    SqR   : 0b1110
    RESRV2: 0b1111 # Reserved if no Pin need to be enabled


MicrocodeChipsPinMap:
  InputPinMap:
    A14: Ukwn0
    A13: Ukwn1
    A12: Flag
    A11: Seqn3
    A10: Seqn2
    A9 : Seqn1
    A8 : Seqn0
    A7 : InsR0
    A6 : InsR1
    A5 : InsR2
    A4 : InsR3
    A3 : InsR4
    A2 : InsR5
    A1 : InsR6
    A0 : InsR7

  OutputPinMap:
    uCode0:
      IO0: FlSe2
      IO1: FlSe1
      IO2: FlSe0
      IO3: T2IS0
      IO4: T2IS1
      IO5: FlgU
      IO6: RESRV4
      IO7: RESRV5

    uCode1:
      IO0: ViInA
      IO1: ViInB
      IO2: ViInC
      IO3: ViInD
      IO4: ViOtA
      IO5: ViOtB
      IO6: ViOtC
